<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberShield360 — Stay one step ahead online</title>
    <meta name="description" content="Investigate suspicious links, messages, emails, images and QR codes, and make safer decisions online." />
    <meta name="theme-color" content="#F3F9F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#06110F" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Dark is the brand default; only switch to light if the user chose it.
      // Also apply the in-app "reduce motion" preference before first paint.
      (function () {
        try {
          var t = localStorage.getItem("cs360-theme");
          document.documentElement.classList.toggle("dark", t === "dark");
          if (localStorage.getItem("cs360-reduce-motion") === "1") {
            document.documentElement.classList.add("reduce-motion");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
