# Production stack for a single always-free VM (e.g. Oracle Cloud Always Free).
# Caddy (TLS) -> static frontend + reverse proxy -> FastAPI backend -> Postgres.
# Build the frontend first (deploy.sh does this) so ../frontend/dist exists.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cybershield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-cybershield}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybershield}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    # Apply migrations, then serve. Runs as the image's non-root user.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    healthcheck:
      # Healthy only once migrations ran and the API answers.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Content worker: fetches public feeds, watches legal documents and selects the
  # daily lesson / quiz / tip. Persistent process (never the browser, never the
  # web process). Safe to scale: jobs are guarded by database leases.
  worker:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      CONTENT_SCHEDULER_EMBEDDED: "false"
    depends_on:
      backend:
        condition: service_healthy
    command: python -m app.content.worker

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
